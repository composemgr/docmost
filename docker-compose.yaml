# nginx proxy address - http://172.17.0.1:64156

name: docmost
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: docmost/docmost:latest
    container_name: docmost-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: docmost-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      APP_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      APP_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars_x}
      DATABASE_URL: postgresql://${DB_USER_NAME:-docmost}:${DB_USER_PASS:-changeme_db_password}@docmost-db:5432/${DB_CREATE_DATABASE_NAME:-docmost}?schema=public
      REDIS_URL: redis://docmost-redis:6379
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64156:3000'
    volumes:
      - './volumes/data/docmost:/app/data/storage:z'
    depends_on:
      docmost-db:
        condition: service_healthy
      docmost-redis:
        condition: service_healthy
    networks:
      - docmost

  docmost-db:
    image: postgres:latest
    container_name: docmost-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: docmost-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: docmost-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-docmost}
      POSTGRES_USER: ${DB_USER_NAME:-docmost}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - './volumes/db/postgres/docmost:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - docmost

  docmost-redis:
    image: redis:alpine
    container_name: docmost-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: docmost-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: docmost-redis
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/db/redis/docmost:/data:z'
    networks:
      - docmost

networks:
  docmost:
    name: docmost
    external: false
